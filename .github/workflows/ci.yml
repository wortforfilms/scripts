name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  maataa-ui:
    name: Maataa UI build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test maataa-ui
        run: pnpm --filter @maataa/maataa-ui test

      - name: Release checklist CI
        run: pnpm release:check

      - name: Typecheck maataa-ui
        run: pnpm --filter @maataa/maataa-ui typecheck

      - name: Build maataa-ui
        run: pnpm --filter @maataa/maataa-ui build
