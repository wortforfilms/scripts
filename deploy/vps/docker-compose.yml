services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maataa}
      POSTGRES_USER: ${POSTGRES_USER:-maataa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maataa}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maataa} -d ${POSTGRES_DB:-maataa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    env_file:
      - .env
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-maataa}:${POSTGRES_PASSWORD:-maataa}@postgres:5432/${POSTGRES_DB:-maataa}
      AUTH_REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  maataa-ui:
    build:
      context: ../..
      dockerfile: apps/maataa-ui/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    working_dir: /app
    volumes:
      - maataa_runtime:/app/.maataa-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth-service
      - maataa-ui
      - icecast

  icecast:
    image: moul/icecast
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  maataa_runtime:
  caddy_data:
  caddy_config:
